syntax = "proto3";

package inventory;

// Inventory Service contract.
//
// Errors are returned as gRPC status codes rather than in the message body:
//   INVALID_ARGUMENT     malformed item_id or non-positive quantity
//   NOT_FOUND            unknown item_id
//   FAILED_PRECONDITION  item exists but not enough stock
service InventoryService {
  rpc CheckInventory(CheckInventoryRequest) returns (CheckInventoryResponse);
}

message CheckInventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckInventoryResponse {
  string item_id = 1;
  int32 requested = 2;
  int32 in_stock = 3;
  bool available = 4;
}
